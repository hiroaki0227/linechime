<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Linechime - prototype</title>
<style>
:root{
  /* 明暗の両方を自分で持っていることを宣言する。
     これが無いと WebView が独自に暗くしようとする */
  color-scheme: light dark;
/* 暗い側は「同じ部屋の明かりを落とした姿」。
   以前は地も盤も案内線も寒色で、明るい側（暖かい紙）とは別のアプリになっていた。
   --glow は線のまわりの光の強さ。暗い地の上では同じ値でも眩しくなるので分ける。 */
  --bg:#16130f; --fg:#ece5d8; --dim:#8b8275; --line:#2e2720; --panel:#1f1a14;
  --guide:#3a362d; --lit:#c9973f; --panel2:#262019; --g2:#c96a5a; --glow:.10;
  /* 層の縁。芯は気分の色なので、縁は気分の4色と当たらない色相にする */
  --r1:#d8d1c2; --r2:#7ba3d6; --r3:#d98a70;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f1ec; --fg:#20242c; --dim:#79808e; --line:#d7d2c9; --panel:#e9e5dd;
         --guide:#c9c0af; --lit:#a9761b; --panel2:#f2efe8; --g2:#b1523f;
         --glow:.16;
         --r1:#3f3a31; --r2:#3f6392; --r3:#a2503c; }
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  transition:background-color 1.1s ease, color 1.1s ease;
  font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
:root{ --pt:0px; --pb:0px; }          /* 状態バンド・操作バンドの高さ。アプリ側が入れる */
.wrap{max-width:520px;margin:0 auto;
  padding:calc(var(--pt) + 14px) 12px calc(var(--pb) + 12px);
  display:flex;flex-direction:column;gap:8px;height:100vh}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.stage canvas{max-height:100%;width:auto;max-width:100%}
.drawer{display:none;flex-direction:column;gap:7px;
  background:var(--panel);border-radius:12px;padding:9px}
.drawer.open{display:flex;max-height:32vh;overflow-y:auto}  /* 盤を潰さない。溢れたら巻く */
.tabs{display:flex;gap:6px;justify-content:center}
/* なぞる画面では棚が1つになる。1枚だけ横一杯に伸びると、棚ではなく帯に見える */
.tabs button{max-width:200px}
/* 枠の強いボタンは道具に見える。触れるまでは沈ませる */
.tabs button{flex:1;padding:12px 4px;font-size:12px;border-color:transparent;
  color:var(--dim);letter-spacing:.14em}
.tabs button.on{border-color:transparent;background:var(--panel);color:var(--fg)}
.sect{font-size:10px;color:var(--dim);letter-spacing:.08em;margin:2px 0 -2px}
header{display:flex;align-items:center;gap:6px;min-height:30px;margin-bottom:2px}
.stat{flex:1;font-size:11px;color:var(--dim);letter-spacing:.22em;opacity:.55;
  text-align:center}
/* 戻るは枠を持たせない。道具ではなく、ただの出口 */
#back,#pback,#mute,#pdel,#send,#precv{width:34px;padding:7px 0;
  border-color:transparent;color:var(--dim)}
#send{display:none}
#mute.on,#mute:active{border-color:transparent;background:transparent;color:var(--fg)}
header .spacer{width:34px}
#picker header .stat{letter-spacing:.22em}

/* 絵で足りるものは絵にする。訳す語が減るだけでなく、読む手間も減る */
svg{width:19px;height:19px;display:block;margin:0 auto;fill:none;stroke:currentColor;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sect svg{width:15px;height:15px;margin:0;opacity:.75}
.sect{display:flex;align-items:center}
#grain svg{width:26px;height:26px;stroke-width:0;fill:currentColor}
.tabs svg{width:20px;height:20px}
#mixer label svg,#rates label svg{flex:0 0 auto}
canvas{width:100%;height:auto;display:block;border-radius:12px;background:var(--panel)}
#cv{touch-action:none}                 /* 指の動きを全部こちらで受け取るのは盤だけ */
/* 帯のときだけ横に流す。格子にも効かせると、札の上で縦に送れなくなる
   （盤の canvas に touch-action:none を掛けて札を巻き込んだのと同じ失敗） */
#picker:not(.grid) .card canvas{touch-action:pan-x}
#picker.grid .card canvas{touch-action:pan-y}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar div{height:100%;width:0;background:var(--lit);transition:width .12s linear}
.row{display:flex;gap:6px;flex-wrap:wrap}
/* 数が多いボタンは、詰めずに折り返す。潰れると縦書きになって読めない。
   英語は語が長い（Glockenspiel）ので、札の中でも折り返させる */
#timbres button{flex:1 1 22%;font-size:11px;padding:9px 2px;line-height:1.25;
  min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center}
#scales button{flex:1 1 22%;white-space:nowrap}
#layers button{flex:1 1 30%;white-space:nowrap}
/* 線の縁と同じ色を札にも置く。縁が何を指しているかを、その場で読めるように */
#layers button.ly1{color:var(--r1)}
#layers button.ly2{color:var(--r2)}
#layers button.ly3{color:var(--r3)}
.row button{flex:1}
#mixer,#rates{align-items:center;gap:10px}
#mixer label,#rates label{flex:1;display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--dim)}
#mixer input,#rates input{flex:1;accent-color:var(--lit);height:22px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;cursor:pointer}
button:active{background:var(--line)}
button.on{border-color:var(--fg);background:var(--panel)}
/* 入らない紙は沈める。ただし押せるままにしておく。
   押せないうえに何も言わないと、なぜ駄目なのか確かめる手段が無くなる */
button.off{opacity:.32}
/* まだ手に入っていないもの。隠さずに沈める。
   何が足りないのかが見えているほうが、伝わるし売れる */
button.locked{opacity:.34;border-style:dashed}
/* 受け取った作品が有料の音色を使っていることがある。
   そのときは「選ばれているが、手に入っていない」を素直に見せる */
button.locked.on{opacity:.55}
#scales button.locked{color:var(--dim);opacity:.5}
.note{color:var(--dim);font-size:12px;line-height:1.7;margin:0;text-align:center;
  transition:opacity 1.4s ease}
#msg.faded{opacity:0}

/* タイトル。盤が裏で描かれ続けるので、被せる面は透ける */
#title{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  padding:calc(var(--pt) + 14px) 0 calc(var(--pb) + 14px);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--bg) 78%, transparent) 0%,
    color-mix(in srgb, var(--bg) 88%, transparent) 55%,
    var(--bg) 100%);
  transition:opacity .55s ease}
#title.gone{opacity:0;pointer-events:none}
/* タイトル中は操作系を隠す。見せたいのは盤だけ */
body.titling header, body.titling .bar,
body.titling .tabs, body.titling #msg{opacity:0;pointer-events:none}
/* 手ほどき中は操作を出さない。選ぶことより、なぞることに集中させる */
/* 使い方の間はタブだけ隠す。戻る口は残す（誤って入った人を閉じ込めない） */
body.tutoring .tabs{opacity:0;pointer-events:none}
body.tutoring #msg{font-size:13px;letter-spacing:.14em;opacity:.85}
/* 使い方の足元。今どこに居るかと、次へ進む口 */
#tbar{display:none;align-items:center;justify-content:center;gap:18px;min-height:34px}
body.tutoring #tbar{display:flex}
#tbar .dots{padding:0}
#tbar .dots i{cursor:pointer;padding:0}
#tnext{width:40px;padding:6px 0;border-color:transparent;color:var(--lit);
  opacity:0;pointer-events:none;transition:opacity .6s ease}
#tnext.ready{opacity:.9;pointer-events:auto}
#tnext:active{background:transparent}
/* 道具の頁。絵の意味を読める場所が要る。棚から消した語は、ここに置いてある */
#tools{display:none;flex:1;min-height:0;overflow-y:auto;flex-direction:column;gap:2px;
  background:var(--panel);border-radius:12px;padding:10px 12px}
body.tools #tools{display:flex}
body.tools .stage{display:none}
.trow{display:flex;align-items:flex-start;gap:12px;padding:9px 2px}
.trow .tico{flex:0 0 auto;display:flex;gap:5px;color:var(--dim);padding-top:1px}
.trow .ttxt{flex:1;min-width:0}
.trow .tnm{font-size:12.5px;letter-spacing:.06em}
.trow .tds{font-size:11px;color:var(--dim);line-height:1.65;margin-top:2px}
/* 9文字あるので、TRACE（5文字）のままの字間だと横に溢れる。
   字を詰めるのではなく、字間と大きさの両方を落として静けさを保つ */
.tname{font-size:26px;letter-spacing:.30em;font-weight:300;margin-right:-.30em;
  white-space:nowrap}
.ttag{font-size:12px;color:var(--dim);letter-spacing:.18em}
/* ボタンではなく、触れれば入る。押す対象があると「操作」になる */
.thint{margin-top:26px;font-size:11px;color:var(--dim);letter-spacing:.3em;
  animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.75}}
#title{transition:opacity 1.6s ease}

/* 触れたあと、タイトルの下に浮かび上がる献立。画面を増やさずに行き先を出す */
#menu{display:flex;flex-direction:column;gap:2px;margin-top:22px;
  opacity:0;pointer-events:none;transition:opacity 1.1s ease}
#title.menu #menu{opacity:1}
/* 触れた指がそのまま項目を押してしまわないように、
   浮かび上がってから受け付ける（実機で「なぞる」が勝手に始まった） */
#title.menu.ready #menu{pointer-events:auto}
#title.menu .thint{opacity:0;animation:none}
#menu button{border-color:transparent;color:var(--fg);font-size:14px;
  letter-spacing:.24em;padding:13px 30px;opacity:.82}
#menu button:active{background:transparent;opacity:1}
#menu .sub{font-size:10px;color:var(--dim);letter-spacing:.18em;
  text-align:center;margin:14px 0 0;opacity:.6}
.plink{display:block;width:100%;text-align:center;margin-top:22px;font-size:10px;
  color:var(--dim);letter-spacing:.16em;opacity:.45;text-decoration:none;
  border-color:transparent;background:transparent;padding:6px 0}
.plink:active{background:transparent;opacity:.8}
#buylink{margin-top:26px}
a.plink{margin-top:10px}


/* 形を選ぶ。1枚に1つ、指で捲る */
#picker{position:fixed;inset:0;z-index:9;background:var(--bg);
  display:none;flex-direction:column;
  padding:calc(var(--pt) + 14px) 0 calc(var(--pb) + 24px);
  opacity:0;transition:opacity .5s ease}
#picker.show{display:flex}
#picker.in{opacity:1}
#picker header{padding:0 12px}
/* 作品の一覧は格子で。探すための画面なので、1枚ずつ捲るより並べたほうが早い。
   形を選ぶ側は「眺めて選ぶ」場なので帯のまま */
#picker.grid .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:12px;padding:2px 12px 12px;overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:none;align-content:start}
#picker.grid .card{flex:none;max-width:none;gap:0}
#picker.grid .card canvas{opacity:1;transform:none;box-shadow:none}
#picker.grid .card:active canvas{transform:scale(.95)}
#picker.grid .dots,#picker.grid #phint{display:none}
.sheet{position:fixed;inset:0;z-index:15;display:none;align-items:center;
  justify-content:center;background:color-mix(in srgb, var(--bg) 88%, transparent);
  padding:16px}
.sheet.show{display:flex}
.sheetbox{background:var(--panel);border-radius:16px;padding:16px;
  width:min(340px,90vw);display:flex;flex-direction:column;gap:10px}
.sheetbox textarea{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--fg);background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px;resize:none;width:100%;
  -webkit-user-select:text;user-select:text}
#codeload{color:var(--lit);border-color:var(--lit)}
.buyttl{margin:0;font-size:13px;letter-spacing:.14em;text-align:center}
.buylist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.buylist li{font-size:12px;color:var(--fg);display:flex;gap:8px;align-items:baseline}
.buylist li::before{content:'';flex:0 0 5px;height:5px;border-radius:50%;
  background:var(--lit);transform:translateY(-2px)}
#buygo{color:var(--lit);border-color:var(--lit)}

#dbg{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--bg) 88%, transparent)}
#dbg.show{display:flex}
.dbgbox{background:var(--panel);border-radius:14px;padding:16px;width:min(320px,86vw);
  display:flex;flex-direction:column;gap:8px;max-height:80vh;overflow-y:auto}
.dbgttl{font-size:11px;letter-spacing:.3em;color:var(--dim)}
.dbgrow{display:flex;align-items:center;gap:6px}
.dbgrow span{flex:0 0 86px;font-size:11px;color:var(--dim)}
.dbgrow button{flex:1;font-size:11px;padding:8px 2px}
.dbginfo{margin:2px 0 0;font-size:10px;color:var(--dim);line-height:1.6}
#dbgclose{font-size:12px;padding:10px}

#ask{position:absolute;inset:0;z-index:3;display:none;align-items:center;
  justify-content:center;background:color-mix(in srgb, var(--bg) 82%, transparent)}
#ask.show{display:flex}
.askbox{background:var(--panel);border-radius:16px;padding:18px 18px 14px;
  width:min(280px,78vw);display:flex;flex-direction:column;align-items:center;gap:12px}
.askbox canvas{width:120px;height:120px;border-radius:12px}
.asktx{margin:0;font-size:12.5px;color:var(--fg);text-align:center;letter-spacing:.06em}
#rec{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-140%);
  z-index:60;display:flex;align-items:center;gap:9px;padding:9px 15px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  box-shadow:0 4px 18px rgba(0,0,0,.14);opacity:0;pointer-events:none;
  transition:transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s}
#rec.on{transform:translateX(-50%) translateY(0);opacity:1}
#rec i{width:11px;height:11px;border-radius:50%;background:#d1443a;flex:0 0 auto;
  animation:recblink 1s steps(2,end) infinite}
/* 出来上がりは本体の目印の色（琥珀）。--g2 は緑ではなく煉瓦色で、
   撮影中の赤とほとんど区別が付かなかった */
#rec.fin i{background:var(--lit);animation:none}
@keyframes recblink{50%{opacity:.25}}
#rec b{font-size:13px;font-weight:400;letter-spacing:.04em;white-space:nowrap}
#rec u{display:block;width:64px;height:4px;border-radius:2px;background:var(--line);
  text-decoration:none;overflow:hidden;flex:0 0 auto}
#rec.fin u{display:none}
#rec s{display:block;height:100%;width:0;background:#d1443a;text-decoration:none;
  transition:width .1s linear}
.askrow{display:flex;gap:8px;width:100%}
.shape{flex:0 0 auto;padding:10px 13px;display:flex;align-items:center;justify-content:center}
.shape i{display:block;border:2px solid currentColor;border-radius:2px;opacity:.55}
.shape.on i{opacity:1}
#shsq i{width:19px;height:19px}
#shv i{width:12px;height:21px}
.askrow button{flex:1;font-size:12.5px;padding:11px 4px}
#askyes{color:var(--g2);border-color:var(--g2)}

/* 消す状態。押した先が消えるので、入っていることが分かる必要がある */
#picker.grid.deleting .card:not(.plus) canvas{outline:2px solid var(--g2);outline-offset:2px}
#picker.grid.deleting .card.plus{opacity:.25;pointer-events:none}
#pdel.arm{color:var(--g2)}

/* 札を細めにして、両隣をはっきり覗かせる。1枚しか見えないと「捲れる」が伝わらない */
.cards{flex:1;display:flex;align-items:center;gap:14px;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  padding:0 17vw;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 66vw;max-width:340px;scroll-snap-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}
.card canvas{width:100%;height:auto;border-radius:16px;background:var(--panel);
  transition:transform .3s ease,opacity .3s ease,box-shadow .3s ease;
  opacity:.45;transform:scale(.9)}
/* 真ん中の1枚だけが「押せるもの」に見えるようにする */
.card.here canvas{opacity:1;transform:scale(1);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--lit) 55%, transparent),
             0 6px 18px color-mix(in srgb, var(--fg) 12%, transparent)}
.card.here:active canvas{transform:scale(.975)}

.dots{display:flex;gap:8px;justify-content:center;padding-top:18px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);
  transition:background-color .3s ease,transform .3s ease}
.dots i.here{background:var(--lit);transform:scale(1.25)}
/* 選択画面は雰囲気の場ではなく決める場なので、一行だけ置く */
#phint{margin:10px 0 0;text-align:center;font-size:11px;color:var(--dim);
  letter-spacing:.22em;opacity:.45}
/* 一覧は盤を全面で覆う。盤側の #msg に書いても、下に隠れて誰にも見えない */
#pmsg{margin:10px 12px 0;min-height:18px;font-size:12px}
</style>

<!-- 起動直後の画面。線が自分で描かれていくのを見せる -->
<div id="title">
  <div class="tname">LINECHIME</div>
  <div class="ttag" data-t="tag"></div>
  <div class="thint" data-t="hint"></div>

  <!-- 触れたあとに浮かぶ。行き先は3つだけ -->
  <nav id="menu">
    <button data-go="trace" data-t="trace"></button>
    <button data-go="free" data-t="draw"></button>
    <p class="sub"><button data-go="manual" data-t="howto" style="letter-spacing:.2em;
      font-size:11px;color:var(--dim);padding:6px 20px"></button></p>
    <!-- 売り込みではなく出口。鍵を押した瞬間が本線で、これは取りこぼしを拾うためのもの。
         買った人には出さない -->
    <button class="plink" id="buylink" data-t="buyTitle"></button>
    <!-- 外のブラウザで開く。アプリ側が自分のサイトだけを通す -->
    <a class="plink" data-t="privacy"
       href="https://hiroaki0227.github.io/linechime/privacy.html"></a>
  </nav>
</div>

<!-- 形を選ぶ。指で捲る -->
<div id="picker">
  <header>
    <button id="pback">←</button>
    <div class="stat" id="ptitle"></div>
    <button id="precv" data-i="recv" data-t="recv"></button>
    <button id="pdel" data-i="clear" data-t="del"></button>
  </header>
  <div class="cards" id="cards"></div>
  <div class="dots" id="dots"></div>
  <p id="phint" data-t="pick"></p>
  <p id="pmsg" class="note"></p>

  <!-- 取り返しがつかないので、何を消すのかを見せて訊く -->
  <div id="ask">
    <div class="askbox">
      <canvas id="askthumb"></canvas>
      <p class="asktx" data-t="delAskTitle"></p>
      <div class="askrow">
        <button id="askno" data-t="cancel"></button>
        <button id="askyes" data-t="del"></button>
      </div>
    </div>
  </div>
</div>

  <!-- すべて解放。親が隠れると丸ごと消えるので body の直下に置く -->
  <div id="buy-w" class="sheet">
    <div class="sheetbox">
      <p class="buyttl" data-t="buyTitle"></p>
      <ul class="buylist" id="buylist"></ul>
      <p class="dbginfo" id="buymsg"></p>
      <div class="askrow">
        <button id="buyclose" data-t="close"></button>
        <button id="buygo" data-t="buyGo"></button>
      </div>
    </div>
  </div>

  <!-- 撮影中の目印。**canvas の外に置く**（中に描くと動画に写り込む） -->
  <div id="rec"><i></i><b id="recsec"></b><u><s id="recbar"></s></u></div>

  <!-- 送る／受け取る。親が隠れると丸ごと消えるので body の直下に置く -->
  <div id="send-w" class="sheet">
    <div class="sheetbox">
      <p class="asktx" data-t="codeHint"></p>
      <textarea id="codeout" readonly rows="4"></textarea>
      <div class="askrow">
        <button id="sendclose" data-t="close"></button>
        <button id="codecopy" data-t="copy"></button>
        <button id="codeshare" data-t="shareTo" style="display:none"></button>
      </div>
      <!-- 撮る形。語を増やさないよう、四角と縦長の絵で選ばせる -->
      <div class="askrow" id="shaperow" style="display:none">
        <button id="shsq" class="shape on"><i></i></button>

const svg = k => '<svg viewBox="0 0 24 24">' + (ICON[k]||'') + '</svg>';

/* 語と絵を画面に流し込む。絵のあるものは、語を読み上げ用の名前として持たせる */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(e => {
    e.innerHTML = svg(e.dataset.i);
    if (e.dataset.t) e.setAttribute('aria-label', T(e.dataset.t));
  });
  document.querySelectorAll('[data-t]').forEach(e => {
    if (e.dataset.i) return;                // 絵に置き換えた場所には字を入れない

let CS = 20;                         // 1マスの描画サイズ（盤の粗さで変える）
let S = DATA[0], N = 32;

/* 層。経路・粒・音色を層ごとに持つ。音階だけは全層で共有する（別々だと濁る）。 */
const LAYERS = 3;
let tracks = [], active = 0;
function newTrack(idx){
  return {idx: idx, path:[], items:[], isLoop:false, isCorner:[], progress:0,
          timbre:0, scale:0, vol:1, rate:1, spawn:0, colorIdx:0};
}
const tk = () => tracks[active];

/* 縁の色は常設の答えだが、選んだ瞬間に目が線を探すことに変わりはない。
   選んだ層の線を一度だけ強く光らせて、「これだ」と即答する */
let layerFlash = {i: -1, t: -1e9};
function flashLayer(i){ layerFlash = {i: i, t: performance.now()}; }
const FLASH_MS = 900;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
/* 画面を作り替えると要素が消えることがある。1つ欠けただけで起動が止まらないようにする */
const $ = id => document.getElementById(id);
const setText = (id, v) => { const e = $(id); if (e) e.textContent = v; };
const px = c => [c[0]*CS + CS/2, c[1]*CS + CS/2];

function load(shape){
  S = shape; N = shape.n;
  CS = Math.round(640 / N);      // 粗い盤ほどマスを大きく
  cv.width = cv.height = N * CS;
  freeMode = !!shape.free;
  tracks = []; for (let i = 0; i < LAYERS; i++) tracks.push(newTrack(i));
  active = 0;
  if (!freeMode){                         // 用意された図形は第1層だけを使う
    tracks[0].path = shape.path;
    markCorners(tracks[0]);
  }
  if (titleMode) tracks[0].progress = 0;
  lit = [];
  updateLayerButtons();
  resetMixer();
  erasing = false;
  /* 使えないものは出さない。なぞる画面には線の道具が無く、層も1本しか無い。
     空の棚を開かせたり、効かないつまみを触らせたりしない */
  const er = document.getElementById('editrow');
  if (er) er.style.display = freeMode ? 'flex' : 'none';
  const sd = $('send');
  if (sd) sd.style.display = freeMode ? 'block' : 'none';
  const lineTab = document.querySelector('.tabs button[data-d=d-edit]');
  if (lineTab){
    lineTab.style.display = freeMode ? '' : 'none';
    if (!freeMode && $('d-edit').classList.contains('open')){
      $('d-edit').classList.remove('open');
      lineTab.classList.remove('on');
    }
  }
  const sl = $('s-layers'), lr = $('layers');
  if (sl) sl.style.display = freeMode ? 'flex' : 'none';
  if (lr) lr.style.display = freeMode ? 'flex' : 'none';
  ['mixer','rates'].forEach(id => {                 // 層2・3は、なぞる画面では空
    const box = $(id);
    if (box) [...box.children].forEach((w, i) => {
      w.style.display = (freeMode || i === 0) ? 'flex' : 'none';
    });
  });
  const gr = $('grain');
  if (gr) gr.style.display = freeMode ? 'flex' : 'none';
  const eb = document.getElementById('erase');
  if (eb) eb.classList.remove('on');      // 絵は入れ替えない。状態は枠だけで示す
  setText('name', T(shape.free ? 'draw' : 'trace'));
  const mel = $('msg');
  if (mel){                              // 説明は用が済んだら消える。出しっぱなしは雑音
    mel.classList.remove('faded');
    clearTimeout(window._msgT);
    window._msgT = setTimeout(() => mel.classList.add('faded'), 6000);
  }
  setText('msg', T(freeMode ? 'mDraw' : 'mTrace'));
  refresh();
}

/* ---- 描画 ---- */
function polyline(path, from, to, color, width, alpha){
  if (to - from < 1) return;
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  for (let i = from; i <= to && i < path.length; i++){
    const [x,y] = px(path[i]);
    i === from ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

/* まだなぞっていない角に、小さな点を置く。鳴る場所を、鳴る前に目で分からせるため。
   通常の図形は角が7割あって点だらけになるので、初回の手ほどきの間だけ出す。 */
function drawCornerHints(t){
  ctx.fillStyle = css('--lit');
  ctx.globalAlpha = 0.9;
  for (let i = 0; i < t.path.length; i++){
    if (!t.isCorner[i] || i <= t.progress) continue;
    const [x,y] = px(t.path[i]);
    ctx.beginPath(); ctx.arc(x, y, CS*0.16, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function draw(){
  const W = cv.width;
  ctx.clearRect(0,0,W,W);

  // 背景。平坦な色面ではなく、中心がわずかに明るい面にする
  const bgGrad = ctx.createRadialGradient(W*0.5, W*0.42, W*0.05, W*0.5, W*0.5, W*0.75);
  bgGrad.addColorStop(0, css('--panel2'));
  bgGrad.addColorStop(1, css('--panel'));
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,W);

  if (freeMode){                                   // 格子は線ではなく点で。線は主張しすぎる
    ctx.fillStyle = css('--guide');
    ctx.globalAlpha = 0.5;
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){
      ctx.beginPath();
      ctx.arc((x+0.5)*CS, (y+0.5)*CS, Math.max(1, CS*0.035), 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else {
    polyline(tracks[0].path, 0, tracks[0].path.length-1, css('--guide'), CS*0.5, 1);
    if (tutorStep >= 0) drawCornerHints(tracks[0]);    // 手ほどきの間だけ「鳴る場所」を先に見せる
  }

  // 奥の層から描く
  for (let i = LAYERS - 1; i >= 0; i--){
    const t = tracks[i];
    if (!t.path.length) continue;
    const on = (i === active);
    const col = SCALES[t.scale].color;
    const core = CS * (on ? 0.5 : 0.34);
    // 光の層を先に敷き、層ごとの縁を回し、最後に芯を重ねる。
    // 色相＝気分、縁＝どの層か。なぞる画面は層が1本しか無いので縁を出さない
    const glow = parseFloat(css('--glow')) || 0.16;
    polyline(t.path, 0, t.progress, col, CS * (on ? 1.05 : 0.8), on ? glow : glow * 0.44);
    // 縁は「どの層か」を言うものなので、選んでいない層でも濃さを落とさない。
    // 選択中かどうかは芯の太さと濃さが持つ
    if (freeMode)
      polyline(t.path, 0, t.progress, css('--r' + (i+1)), core + CS*0.19, on ? 0.95 : 0.8);
    polyline(t.path, 0, t.progress, col, core, on ? 1 : 0.4);
    if (freeMode && i === layerFlash.i){        // 選んだ層は一度だけ強く光る
      const u = (performance.now() - layerFlash.t) / FLASH_MS;
      if (u >= 0 && u < 1)
        polyline(t.path, 0, t.progress, css('--r' + (i+1)),
                 core + CS * (0.19 + 1.1 * u), (1 - u) * 0.6);   // 線から外へ広がる
    }

    for (const it of t.items){
      const a = on ? 1 : 0.5;
      for (let k = 3; k >= 1; k--){                // 尾を引かせる
        let q = it.p - k * 0.34;
        if (q < 0) q = t.isLoop ? q + t.path.length : -1;
        if (q < 0) continue;
        const [tx,ty] = along(t, q);
        if (tx === null) continue;
        orb(tx, ty, CS * (it.sings ? 0.30 : 0.22) * (1 - k*0.16), hueOf(t, it), a * (0.22 - k*0.05));
      }
      const [x,y] = along(t, it.p);
      if (x === null) continue;
      orb(x, y, CS * (it.sings ? 0.30 : 0.22) * (on ? 1 : 0.85), hueOf(t, it), a);
    }
  }

  // 音が鳴った場所から広がる輪。耳で起きたことを目にも出す
  for (const f of flashes){
    const [x,y] = px(f.c);
    ctx.strokeStyle = f.col;
    ctx.globalAlpha = f.a * 0.55;
    ctx.lineWidth = CS * 0.09 * f.a;
    ctx.beginPath();
    ctx.arc(x, y, CS * (0.3 + (1 - f.a) * 1.5), 0, 7);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  for (const l of lit){                            // なぞった瞬間の光
    const [x,y] = px(l.c);
    orb(x, y, CS*(0.3 + (1-l.a)*0.45), css('--lit'), l.a * 0.4);
  }

  const t0 = tk();
  if (t0.path.length){
    if (!t0.isLoop && t0.progress < t0.path.length - 1){
      // 終わりは目立たせない。印が2つ張り合うと、どちらから始めるか分からなくなる
      const [gx,gy] = px(t0.path[t0.path.length-1]);
      ring(gx, gy, css('--guide'), CS*0.06, 0.5);
    }
    startHint(t0);
  }
}

/* 玉。単色の円ではなく、中心が明るく縁が溶ける球にする */
function orb(x, y, r, col, alpha){
  const g = ctx.createRadialGradient(x - r*0.25, y - r*0.3, r*0.1, x, y, r);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.35, col);
  g.addColorStop(1, col);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}

/* 経路上の連続位置 p を座標に変換する。
   各マスの中心を通る折れ線ではなく、辺の中点どうしを二次ベジェで結ぶ。
   結果として、マス中心を回り込む弧になる = 角を「曲がる」動きになる。 */
function along(t, p){
  const path = t.path;
  const i = Math.floor(p), f = p - i;
  if (i < 0 || i >= path.length) return [null, null];
  const c = px(path[i]);
  const prev = i > 0 ? px(path[i-1]) : (t.isLoop ? px(path[path.length-1]) : c);
  const next = i+1 < path.length ? px(path[i+1]) : (t.isLoop ? px(path[0]) : c);
  const p0 = [(prev[0]+c[0])/2, (prev[1]+c[1])/2];
  const p2 = [(c[0]+next[0])/2, (c[1]+next[1])/2];
  const g = 1 - f;
  return [g*g*p0[0] + 2*g*f*c[0] + f*f*p2[0],
          g*g*p0[1] + 2*g*f*c[1] + f*f*p2[1]];
}

function ring(x, y, c, w, a){
  ctx.strokeStyle = c; ctx.lineWidth = w || 3.5;
  ctx.globalAlpha = (a === undefined) ? 1 : a;
  ctx.beginPath(); ctx.arc(x, y, CS*0.52, 0, 7); ctx.stroke();
  ctx.globalAlpha = 1;
}

/* なぞり始める場所は、印を置くだけでは伝わらない。
   緑と赤を同じ大きさ・同じ形で置いても「飾りが2つある」ようにしか見えないし、
   赤緑は最も多い色覚特性で区別できない。**色ではなく動きで言う。**
   指を置く場所で波紋が広がり、そこから玉が数マス走って消える。
   「ここに触れる」と「こちらへ進む」を、一続きの動きで見せる。 */
function startHint(t){
  if (t.progress > 0 || t.path.length < 2) return;
  const now = performance.now(), cyc = 2200;   // ゆっくり。急かすと雰囲気が壊れる
  const f = (now % cyc) / cyc;
  const [sx, sy] = px(t.path[0]);
  const col = css('--lit');

  ctx.strokeStyle = col;                       // 広がる波紋
  ctx.globalAlpha = (1 - f) * 0.45;
  ctx.lineWidth = CS * 0.09 * (1 - f);
  ctx.beginPath(); ctx.arc(sx, sy, CS * (0.34 + f * 0.85), 0, 7); ctx.stroke();
  ctx.globalAlpha = 1;

  if (f > 0.22){                               // 進む向きは、玉が走って見せる
    const g = (f - 0.22) / 0.78;
    const run = Math.min(6, t.path.length - 1);
    const a = Math.sin(g * Math.PI) * 0.75;    // 出て、濃くなって、消える
    for (let k = 3; k >= 0; k--){              // 尾を引かせないと、点滅にしか見えない
      const q = g * run - k * 0.42;
      if (q < 0) continue;
      const [gx, gy] = along(t, q);
      if (gx !== null) orb(gx, gy, CS * (0.21 - k*0.03), col, a * (1 - k*0.24));
    }
  }
  orb(sx, sy, CS * 0.21, col, 0.95);           // 指を置く点。ここだけは動かない
}

/* ---- 音 ----------------------------------------------------------------
   角を曲がる瞬間に音を鳴らす。経路の形がそのままリズムになる。
   音階はペンタトニック。どのマスがどの順で鳴っても濁らないので、
   プレイヤーがどんな線を引いても音楽として破綻しない。
   音源は持たず、その場で合成する（容量ゼロ・オフライン維持）。 */
let audio = null, master = null, muted = false;
let lastSlot = {};   // 層ごとに独立して数える。共有すると層が音を奪い合う
let phase = false;      // 位相ずらしモード
let freeMode = false, isLoop = false, erasing = false;   // 自由に描くモードと、輪になっているか
/* 音階。どれも5音で構成する。7音にすると組み合わせによって濁り、

   層ごとに変えられる。実測したところ、組み合わせのきつさは
   「せつない」「南の島」を単独で使う場合と同程度に収まる。 */

   strike:{gain:0.04, decay:0.008, ratio:14, q:2.2}},

  {name:'紙', level:0.364, tip:'こすれ。細かい破裂の集まり', lp:9000,
   parts:[],                                       // 音程を持つ成分は無い
   texture:{gain:0.4, attack:0.05, decay:0.38, ratio:6, q:0.6, flutter:7}},

  {name:'竹', level:1.207, tip:'一発の雑音は打楽器になる。その性質を活かす', lp:7000,
   parts:[],
   texture:{gain:0.5, attack:0.012, decay:0.16, ratio:6, q:1.4}},



  {name:'風切り', level:1.674, tip:'鋭い雑音が帯域を上へ滑らせながら消える', lp:11000,
   parts:[],
   texture:{gain:0.45, attack:0.008, decay:0.12, ratio:7, q:2.2, sweep:2.4}},
];
let timbreIdx = 0;
let noiseBuf = null;
let pad = null;      // 空間の床。点で鳴る音だけだと「場所」にならない

/* ごく低い持続音を敷く。音量は聞こえるか聞こえないかの境目。
   数秒周期でゆっくり揺らすことで、止まっていない空間になる。 */
function startPad(){
  if (pad || !audio) return;
  const out = master || audio.destination;
  const g = audio.createGain();
  g.gain.value = 0.0001;                 // 直接入れる。予約だけだと読み出しは既定値の1のまま
  const lp = audio.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 0.7;
  lp.connect(g); g.connect(out);

  // 根音とその5度。わずかにずらして、ゆっくりうねらせる
  const oscs = [];
  for (const [f, d, amp] of [[55, -3, 1], [55, 4, 1], [82.5, 6, 0.55], [110, -5, 0.4]]){
    const o = audio.createOscillator();
    o.type = 'sine'; o.frequency.value = f; o.detune.value = d;
    const og = audio.createGain(); og.gain.value = amp * 0.25;
    o.connect(og); og.connect(lp); o.start();
    oscs.push(o);
  }
  // 呼吸。周期をずらした2つの揺れを重ねて、繰り返しに聞こえないようにする
  for (const [rate, depth] of [[0.055, 90], [0.031, 55]]){
    const lfo = audio.createOscillator();
    lfo.type = 'sine'; lfo.frequency.value = rate;
    const lg = audio.createGain(); lg.gain.value = depth;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }
  pad = {gain: g, oscs: oscs, level: 0.0001};
}

function padLevel(v, sec){
  if (!pad || !audio) return;
  const now = audio.currentTime;
  // 現在値を読み出すと既定値が返ることがあるので、自分で覚えておいた値を起点にする
  const from = Math.max(0.0001, pad.level);
  const to = Math.max(0.0001, v);
  pad.gain.gain.cancelScheduledValues(now);
  pad.gain.gain.setValueAtTime(from, now);
  pad.gain.gain.exponentialRampToValueAtTime(to, now + (sec || 2));
  pad.level = to;
}

/* 音を作る本体。live でも offline でも同じ経路を通す。
   ここを共有しないと、測って揃えた音量が実際の音と食い違う。 */
function buildVoice(ctx, dest, freq, T, o){
  const now = o.now, trace = o.trace, vel = o.vel, scale = o.scale, stretch = o.stretch;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = trace ? 2600 : T.lp;
  lp.connect(dest);

  let sink = lp;
  if (T.body && !trace){                     // 共鳴体（マリンバの管、カリンバの箱）
    const bp = ctx.createBiquadFilter();
    bp.type = 'peaking';
    bp.frequency.value = freq;
    bp.Q.value = T.body.q;
    bp.gain.value = T.body.gain * 6;
    bp.connect(lp);
    sink = bp;
  }

  const lvl = (T.level === undefined ? 1 : T.level);
  const gsum = T.parts.reduce((a, p) => a + p[1], 0);
  const norm = gsum > 0 ? 1 / gsum : 0;           // 紙のように音程成分が無い音色もある
  let last = 0;
  for (const [ratio, g, dec, type, cents, sweep] of T.parts){
    const osc = ctx.createOscillator();
    osc.type = trace ? 'sine' : type;
    osc.frequency.value = freq * ratio;
    if (sweep && !trace){                        // 水滴。高い所から一瞬で落ちる
      osc.frequency.setValueAtTime(freq * ratio * sweep, now);
      osc.frequency.exponentialRampToValueAtTime(freq * ratio, now + (T.sweepTime || 0.055));
    }
    osc.detune.value = (cents || 0) + (Math.random() * 4 - 2);
    const pg = ctx.createGain();
    const d = (trace ? Math.min(dec, 0.16) : dec) * stretch;
    const peak = Math.max(0.0001, 0.12 * g * norm * vel * scale * lvl);
    pg.gain.setValueAtTime(0.0001, now);
    pg.gain.exponentialRampToValueAtTime(peak, now + 0.006);
    pg.gain.exponentialRampToValueAtTime(0.0001, now + d);
    osc.connect(pg); pg.connect(sink);
    osc.start(now); osc.stop(now + d + 0.1);
    last = Math.max(last, d);
  }

  if (T.texture && !trace){
    // 音程を持たない音色。帯域の中心をマスの高さに連動させることで、
    // 「高い紙」「低い紙」を作り、位置と音の対応を保つ。
    const src = ctx.createBufferSource();
    src.buffer = (ctx === audio) ? noiseBuf : makeNoise(ctx);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = Math.min(freq * T.texture.ratio, 12000);
    bp.Q.value = T.texture.q;
    if (T.texture.sweep){                        // はさみ。擦れが上へ抜ける
      bp.frequency.setValueAtTime(bp.frequency.value, now);
      bp.frequency.exponentialRampToValueAtTime(
        Math.min(freq * T.texture.ratio * T.texture.sweep, 15000),
        now + T.texture.decay * 0.8);
    }
    const ng = ctx.createGain();
    const pk = Math.max(0.0001, T.texture.gain * vel * scale * lvl);
    const dur = T.texture.decay * stretch;
    ng.gain.setValueAtTime(0.0001, now);
    ng.gain.exponentialRampToValueAtTime(pk, now + T.texture.attack);
    const fl = T.texture.flutter || 0;
    if (fl){
      // 一発の雑音は打楽器にしかならない。細かく揺らすと擦れ音になる
      for (let k = 1; k <= fl; k++){
        const t = now + T.texture.attack + (dur - T.texture.attack) * (k / fl);
        const v = pk * (1 - k / (fl + 1)) * (0.4 + Math.random() * 0.9);
        ng.gain.exponentialRampToValueAtTime(Math.max(0.0001, v), t);
      }
    }
    ng.gain.exponentialRampToValueAtTime(0.0001, now + dur + 0.01);
    src.connect(bp); bp.connect(ng); ng.connect(sink);
    src.start(now); src.stop(now + T.texture.decay * stretch + 0.05);
  }

  if (T.strike && !trace){
    // 撥が当たる瞬間の音。ハイパスで広く鳴らすと、楽器と無関係な帯域まで
    // 「サーッ」と出て、別の音が重なって聞こえる。
    // 実際の撥音はバーの振動モードに色付けされた狭い帯域なので、
    // 音程に連動したバンドパスにして、共鳴体にも通す。
    const src = ctx.createBufferSource();
    src.buffer = (ctx === audio) ? noiseBuf : makeNoise(ctx);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = Math.min(freq * T.strike.ratio, 14000);
    bp.Q.value = T.strike.q;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(Math.max(0.0001, T.strike.gain * vel * scale * lvl), now);
    ng.gain.exponentialRampToValueAtTime(0.0001, now + T.strike.decay);
    src.connect(bp); bp.connect(ng); ng.connect(sink);
    src.start(now); src.stop(now + T.strike.decay + 0.04);
  }
  return last;
}

function makeNoise(ctx){
  const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.2), ctx.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

/* 各音色を実際に鳴らして音量を測り、「やわらかい」に揃える倍率を求める。
   耳は高い倍音に敏感なので、振幅を揃えても聞こえ方は揃わない。実測でしか合わない。 */
async function measureLevels(applyLevel){
  const rms = [];
  for (const T of TIMBRES){
    const dur = 4;
    const ctx = new OfflineAudioContext(1, 44100 * dur, 44100);
    const saved = T.level;
    if (!applyLevel) T.level = 1;   // 補正前の素の音量を測るとき
    // 1音ではなく、実際の演奏（毎秒6音）を再現して測る。
    // 減衰の長い音色は重なって聞こえるので、単発では実際の音量が分からない。
    const scale = [0, 2, 4, 7, 9, 12, 14, 16];
    for (let i = 0; i < 6 * (dur - 1); i++){
      const semi = scale[i % scale.length];
      buildVoice(ctx, ctx.destination, 220 * Math.pow(2, semi/12), T,
                 {now: i / 6, trace:false, vel:1, scale:1, stretch:1});
    }
    T.level = saved;
    const buf = await ctx.startRendering();
    const d = buf.getChannelData(0);
    let sum = 0;
    for (let i = 0; i < d.length; i++) sum += d[i] * d[i];
    rms.push(Math.sqrt(sum / d.length));
  }
  return rms;
}
const RATE = 6;                                // 1秒あたりの拍数。角はこの格子に吸着する

function initAudio(){
  try {
    if (!audio){
      audio = new (window.AudioContext || window.webkitAudioContext)();
      // 減衰の長い音色では十数音が重なる。素通しだと歪むので、出力段で潰す
      master = audio.createGain();
      master.gain.value = 0.85;
      const comp = audio.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 6; comp.release.value = 0.25;
      master.connect(comp); comp.connect(audio.destination);
      // 打撃音に使う白色雑音。0.2秒ぶんを一度だけ作って使い回す
      noiseBuf = audio.createBuffer(1, audio.sampleRate * 0.2, audio.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (audio.state === 'suspended') audio.resume();   // 触るたびに起こす
  } catch(e){}
}
let noteCalls = 0, notePlayed = 0, noteWhy = '';
function note(cell, kind, voice, timbre, layer){
  voice = voice || 0;
  noteCalls++;                                   // 呼ばれた回数
  if (!audio){ noteWhy = 'audio無'; return; }
  if (muted){ noteWhy = '消音中'; return; }
  // 角が鳴った時刻のままだと発生がバラバラでノイズになる。
  // 拍の格子に吸着させ、1拍につき1音だけ鳴らすことでリズムに変える。
  const now = audio.currentTime;
  const slot = Math.floor(now * RATE * 2);     // 保険。層と声ごとに独立して数える
  const key = (layer === undefined ? 0 : layer) + ':' + voice;
  if (slot === lastSlot[key]){ noteWhy = '拍が重複'; return; }
  lastSlot[key] = slot;
  notePlayed++;                                  // 実際に音を作った回数
  noteWhy = '';

  const up = 1 - cell[1] / N;                  // 画面の上ほど高い音
  const deg = Math.round(up * 14);
  const li = (layer !== undefined && tracks[layer]) ? tracks[layer].scale : scaleIdx;
  const SC = SCALES[li].deg;
  const semi = SC[deg % SC.length] + 12 * Math.floor(deg / SC.length);
  // 第2声は1オクターブ下・柔らかい音色にして、主旋律と混ざらないようにする
  const oct = voice === 1 ? 0.5 : 1;
  const freq = 220 * Math.pow(2, semi / 12) * (kind === 'trace' ? 2 : 1) * oct;

  const T = TIMBRES[timbre === undefined ? timbreIdx : timbre];
  const pan = audio.createStereoPanner ? audio.createStereoPanner() : null;
  if (pan) pan.pan.value = (cell[0] / N) * 1.6 - 0.8;   // 左右の位置で定位
  const out = master || audio.destination;
  let dest = out;
  if (pan){ pan.connect(out); dest = pan; }

  const vel = 0.85 + Math.random() * 0.3;    // 弾くたびに少し変える
  const lvol = (layer !== undefined && tracks[layer]) ? tracks[layer].vol : 1;
  if (lvol <= 0){ noteWhy = '層が消音'; return; }   // 0のまま進むと発音側が例外を投げる
  buildVoice(audio, dest, freq, T, {
    now: now,
    trace: kind === 'trace',
    vel: vel,
    scale: (kind === 'trace' ? 0.45 : (voice === 1 ? 0.75 : 1)) * lvol,
    stretch: voice === 1 ? 1.8 : 1,
  });
  beat = 1;
  // 鳴った場所そのものを光らせる。隅で点滅させても、どこで鳴ったか分からない
  flashes.push({c: cell, a: 1, col: SCALES[(layer !== undefined && tracks[layer]) ? tracks[layer].scale : scaleIdx].color});
  if (flashes.length > 24) flashes.shift();
}
let beat = 0;
let flashes = [];   // 音が鳴った場所に出す輪
let titleMode = true;   // タイトル表示中は線が自分で伸びる

/* 初回の手ほどき。説明せず、短い形を順になぞらせて体で覚えてもらう。
   最初の1つは9マス・角1つ。報酬が遠いと「なぞると鳴る」が結びつかない。 */
const TUTOR = [
  {name:'', n:16, msg:'なぞってみる',
   path:[[4,9],[5,9],[6,9],[7,9],[8,9],[8,8],[8,7],[8,6],[8,5]]},
  {name:'', n:16, msg:'角で音が鳴る',
   path:(() => { const p=[]; let x=3,y=10;
     for (let i=0;i<5;i++){ p.push([x,y]); x++; p.push([x,y]); y--; p.push([x,y]); x++; p.push([x,y]); y++; }
     p.push([x,y]); return p; })()},
  {name:'', n:16, loop:true, msg:'輪にすると、回り続ける',
   path:(() => { const p=[];
     for (let x=4;x<=11;x++) p.push([x,5]);
     for (let y=6;y<=10;y++) p.push([11,y]);
     for (let x=10;x>=4;x--) p.push([x,10]);
     for (let y=9;y>=6;y--) p.push([4,y]);
     return p; })()},
  {tools:true},                        // 4頁目は、絵の意味を読む場所
];
let tutorStep = -1;     // -1 = 手ほどきではない

/* 角かどうかを先に計算しておく。毎フレーム判定すると無駄 */
let isCorner = [];
function markCorners(t){
  const p = t.path;
  t.isCorner = p.map((c, i) => {
    const a = t.isLoop ? p[(i-1+p.length)%p.length] : p[i-1];
    const d = t.isLoop ? p[(i+1)%p.length] : p[i+1];
    if (!a || !d) return false;
    return (c[0]-a[0]) !== (d[0]-c[0]) || (c[1]-a[1]) !== (d[1]-c[1]);
  });
}

/* ---- なぞる: 指の近くにある「次のマス」へ進む ---- */
const LOOK = 14;        // 何マス先まで拾うか（速くなぞってもついてくる）
const TOL = 1.9;        // 指とマスの許容距離（マス単位）
let tracing = false;

function cellOf(ev){
  const r = cv.getBoundingClientRect();
  return [(ev.clientX-r.left)/r.width*N, (ev.clientY-r.top)/r.height*N];
}
/* 自由モード: 指の方へ1マスずつ線を伸ばす。同じマスは二度通らない（経路は一本道）。
   最後が始点の隣に来たら輪として閉じる。 */
/* 1マス戻す。輪だった場合は輪が解ける */
function undoCell(){
  const t = tk();
  if (!freeMode || !t.path.length) return;
  t.path.pop();
  if (t.isLoop){ t.isLoop = false; t.items = []; }
  t.progress = Math.max(0, t.path.length - 1);
  markCorners(t); refresh();
}

/* 部分消し。経路は一本道なので、触れたマスより先を切り落とす */
function truncateAt(cell){
  const t = tk();
  if (!freeMode) return;
  const i = t.path.findIndex(p => p[0] === cell[0] && p[1] === cell[1]);
  if (i < 0) return;
  t.path = t.path.slice(0, i);
  if (t.isLoop){ t.isLoop = false; t.items = []; }
  t.progress = Math.max(0, t.path.length - 1);
  markCorners(t); refresh();
}

/* 輪ができたら、玉を等間隔に置く。鳴るのは1個だけで、残りは目のためのもの */
function seedLoop(t){
  t.items = [];
  const k = Math.max(2, Math.round(t.path.length / 26));
  for (let i = 0; i < k; i++)
    t.items.push({p: i * t.path.length / k, lane: 0, sp: SPEED, turns: 0,
                  ci: i, sings: i === 0});
}

function extend(ev){
  const t = tk();
  const [fx,fy] = cellOf(ev);
  const c0 = [Math.floor(fx), Math.floor(fy)];
  if (c0[0]<0 || c0[1]<0 || c0[0]>=N || c0[1]>=N) return;
  if (!t.path.length){ t.path.push(c0); markCorners(t); refresh(); return; }
  if (erasing){ truncateAt(c0); return; }
  for (let guard=0; guard<4; guard++){
    const c = t.path[t.path.length-1];
    const dx = c0[0]-c[0], dy = c0[1]-c[1];
    if (!dx && !dy) break;
    const cand = Math.abs(dx) >= Math.abs(dy)
      ? [[Math.sign(dx),0],[0,Math.sign(dy)]] : [[0,Math.sign(dy)],[Math.sign(dx),0]];
    let moved = false;
    for (const [sx,sy] of cand){
      if (!sx && !sy) continue;
      const n = [c[0]+sx, c[1]+sy];
      if (n[0]<0||n[1]<0||n[0]>=N||n[1]>=N) continue;
      if (t.path.some(p => p[0]===n[0] && p[1]===n[1])) continue;
      t.path.push(n); lit.push({c:n, a:1}); moved = true; break;
    }
    if (!moved) break;
  }
  /* 斜めまで戻ってきたら、橋を1マス架けて縦横の隣にする。
     「戻ってきたのに閉じない」が、輪を作れない一番の原因だった。
     斜めのまま閉じると経路が4方向連結でなくなり、玉が角を飛ぶ。 */
  if (t.path.length > 6 && !t.isLoop){
    const a = t.path[0], b = t.path[t.path.length-1];
    const dx = a[0]-b[0], dy = a[1]-b[1];
    if (Math.abs(dx) === 1 && Math.abs(dy) === 1){
      for (const br of [[b[0]+dx, b[1]], [b[0], b[1]+dy]]){
        if (br[0]<0 || br[1]<0 || br[0]>=N || br[1]>=N) continue;
        if (t.path.some(p => p[0]===br[0] && p[1]===br[1])) continue;
        t.path.push(br); lit.push({c:br, a:1});
        break;
      }
    }
  }
  if (t.path.length > 6){                    // 始点の隣に戻ったら輪にする
    const a = t.path[0], b = t.path[t.path.length-1];
    if (Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) === 1){
      t.isLoop = true;
      markCorners(t);
      seedLoop(t);
        }
  }
  t.progress = t.path.length-1;
  markCorners(t);
  refresh();
}

function advance(ev){
  const t = tracks[0];
  const [fx,fy] = cellOf(ev);
  let bestI = -1, bestD = TOL;
  for (let i = t.progress; i <= Math.min(t.progress+LOOK, t.path.length-1); i++){
    const d = Math.hypot(t.path[i][0]+0.5-fx, t.path[i][1]+0.5-fy);
    if (d <= bestD){ bestD = d; bestI = i; }
  }
  if (bestI >= t.path.length - 3) bestI = t.path.length - 1;
  if (bestI > t.progress){
    for (let i = t.progress+1; i <= bestI; i++){
      lit.push({c: t.path[i], a: 1});
      if (t.isCorner[i]) note(t.path[i], 'trace', 0, t.timbre, t.idx);
    }
    t.progress = bestI;
    refresh();
  }
}

cv.addEventListener('pointerdown', ev => {
  ev.preventDefault(); cv.setPointerCapture(ev.pointerId);
  initAudio();
  tracing = true;
  if (freeMode) extend(ev); else advance(ev);
});
cv.addEventListener('pointermove', ev => {
  if (!tracing) return;
  try { freeMode ? extend(ev) : advance(ev); }
  catch(e){ diag('move例外: ' + e.message); } });
const stop = () => { tracing = false; };
cv.addEventListener('pointerup', stop);
cv.addEventListener('pointercancel', stop);

/* ---- 完成したら流れ出す ---- */
/* 速度は「毎秒何マス」で持つ。1フレームあたりで持つと、
   120Hz の端末では 60Hz の2倍速で動いてしまう。 */
const SPEED = 8.4;      // 毎秒進むマス数
const SPAWN = 0.63;     // 何秒ごとに1個出すか
let lastT = 0;

const OLD = ['#e0a34a','#5fb98a','#7aa6d9','#c98ac0','#c96a5a'];
const itemColors = t => OLD;
const hueOf = (t, it) => { const c = itemColors(t); return c[it.ci % c.length]; };

/* なぞっている最中から流す。報酬を最後まで取っておくと、途中がただの労働になる。
   品物はなぞった先端で詰まって待ち、線が伸びた瞬間に一斉に前へ出る。 */
function tick(now){
  requestAnimationFrame(tick);   // 何より先に次を予約する。
                                 // どの分岐で return しても、例外が出ても、ループは死なない
  now = now || performance.now();
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!(dt > 0) || dt > 0.25) dt = 1 / 60;   // 初回と、裏に回った後の飛びを抑える
  if (titleMode){                       // 見せるための自動描画
    const t = tracks[0];
    if (t.path.length){
      t.progress = Math.min(t.path.length - 1, t.progress + 14 * dt);
      if (t.progress >= t.path.length - 1){
        t.progress = t.path.length - 1;
        // 献立は「眺める場所」になったので、描き終えたら次の形へ移る
        if (!titleT) titleT = setTimeout(() => {
          titleT = null;
          if (titleMode){ titleIdx = (titleIdx + 1) % DATA.length; load(DATA[titleIdx]); }
        }, 2600);
      }
    }
  }
  for (const t of tracks) stepTrack(t, dt);
  tutorCheck();
  fade();
  try { draw(); updateDiag(); } catch(e){ console.error(e); }
}

/* 1層ぶんの進行。層ごとに独立して粒が流れ、層ごとの音色で鳴る */
function stepTrack(t, dt){
  if (t.progress <= 0 || !t.path.length) return;

  if (t.isLoop){                                 // 輪はぐるぐる回る
    for (const it of t.items){
      const before = Math.floor(it.p);
      it.p = (it.p + it.sp * t.rate * dt) % t.path.length;
      const now = Math.floor(it.p);
      if (now !== before && t.isCorner[now] && it.sings)
        note(t.path[now], 'turn', 0, t.timbre, t.idx);
    }
    return;
  }

  t.spawn += dt;
  if (t.spawn >= SPAWN / t.rate){
    t.spawn = 0;
    const lane = phase ? (t.colorIdx & 1) : 0;
    t.items.push({p:0, lane: lane,
                  sp: SPEED * (lane === 1 ? 1.07 : 1),
                  turns: 0,
                  ci: t.colorIdx++,          // 色そのものは持たせない。世界が変われば色も変わる
                  sings: !t.items.some(i => i.sings && i.lane === lane)});
  }
  const front = t.progress;
  const limit = [front, front];
  for (const it of t.items){
    const before = Math.floor(it.p);
    it.p = Math.min(it.p + it.sp * t.rate * dt, limit[it.lane]);
    const now = Math.floor(it.p);
    if (now !== before && t.isCorner[now] && it.sings){
      it.turns++;
      if (it.lane === 0 || it.turns % 2 === 0)
        note(t.path[now], 'turn', it.lane, t.timbre, t.idx);
    }
    limit[it.lane] = it.p - 1.7;
  }
  t.items = t.items.filter(it => it.p < t.path.length-1);
}

/* なぞった瞬間のマスを一瞬光らせる。手応えが無いと作業に感じる */

function fade(){

  lit = lit.filter(l => l.a > 0);
  for (const f of flashes) f.a -= 0.045;
  flashes = flashes.filter(f => f.a > 0);

/* 音の出力遅延。実機で測って、WebViewで許容できるかを判断するための数字。

function latencyText(){
  if (!audio) return '未計測';
  const b = (audio.baseLatency || 0) * 1000;
  const o = (audio.outputLatency || 0) * 1000;
  if (!o) return b.toFixed(0) + 'ms';
  return (b + o).toFixed(0) + 'ms(内訳 ' + b.toFixed(0) + '+' + o.toFixed(0) + ')';
}

/* 開いた瞬間に帯がわずかに動いて落ち着く。「横に動く」を動きで言う。
   scroll-snap を掛けたままずらすと即座に引き戻されて何も見えないので、
   ずらす間だけ吸着を外す */
function nudgeCards(){
  const el = cardsEl;
  if (!el || el.scrollWidth <= el.clientWidth + 4) return;
  const home = el.scrollLeft, out = 72, t0 = performance.now();
  el.style.scrollSnapType = 'none';
  // 出て、止まって、戻る。ブラウザ任せの smooth は 64px だと一瞬で終わって見えない
  const ease = u => u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
  const step = now => {
    const t = now - t0;
    let d;
    if (t < 340)       d = ease(t / 340) * out;               // 押し出す
    else if (t < 520)  d = out;                               // 少し止める
    else if (t < 1000) d = out * (1 - ease((t - 520) / 480)); // 戻る
    else { el.scrollLeft = home; el.style.scrollSnapType = ''; return; }
    el.scrollLeft = home + d;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---- 共有コード ------------------------------------------------------
   作品を短い文字列にする。拡散が唯一の流入経路なので、送るのも受け取るのも無料。
   端末が消えても、この文字列さえあれば戻せる（更新事故に対する実質の保険）。

   経路は「同じマスを二度通らない一本道」なので、1歩あたり4方向＝2ビットで足りる。
   145マスの経路が36バイト。3層でも百数十文字に収まる。 */
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];
const CODE_VER = 1;

function Bits(){
  return {b: [], put(v, n){ for (let i = n-1; i >= 0; i--) this.b.push((v >> i) & 1); }};
}
function packBits(bits){
  let out = '';
  for (let i = 0; i < bits.length; i += 6){
    let v = 0;
    for (let k = 0; k < 6; k++) v = (v << 1) | (bits[i+k] || 0);
    out += B64[v];
  }
  return out;
}
function unpackBits(str){
  const bits = [];
  for (const ch of str){
    const v = B64.indexOf(ch);
    if (v < 0) return null;
    for (let i = 5; i >= 0; i--) bits.push((v >> i) & 1);
  }
  return bits;
}

function encodeWork(w){
  const ls = w.l.filter(x => x.p && x.p.length);
  if (!ls.length) return '';
  const bw = Bits();
  bw.put(CODE_VER, 4);
  bw.put(w.n === 24 ? 1 : 0, 1);
  bw.put(ls.length - 1, 2);
  for (const sv of ls){
    bw.put(sv.s & 3, 2);
    bw.put(sv.t & 15, 4);
    bw.put(Math.max(0, Math.min(100, sv.v == null ? 100 : sv.v)), 7);
    bw.put(Math.max(0, Math.min(255, sv.r == null ? 100 : sv.r)), 8);
    bw.put(sv.o ? 1 : 0, 1);
    bw.put(Math.min(1023, sv.p.length), 10);
    bw.put(sv.p[0][0], 5);
    bw.put(sv.p[0][1], 5);
    for (let i = 1; i < sv.p.length; i++){
      const dx = sv.p[i][0] - sv.p[i-1][0], dy = sv.p[i][1] - sv.p[i-1][1];
      const d = DIRS.findIndex(q => q[0] === dx && q[1] === dy);
      bw.put(d < 0 ? 0 : d, 2);          // 一本道なので必ず4方向のどれか
    }
  }
  let sum = 0;
  for (let i = 0; i < bw.b.length; i++) sum = (sum + bw.b[i] * (i + 1)) & 255;
  bw.put(sum, 8);                        // 途切れや打ち間違いを、そのまま読ませない
  return packBits(bw.b);
}

/* 貼られるのはコードだけとは限らない。共有シート越しだと
   「TRACE の線を送ります…」のような文章が前に付く。
   英数字を全部繋げると別物になるので、**塊ごとに切り出して長いほうから試す。** */
function decodeWork(str){
  const runs = String(str || '').match(/[A-Za-z0-9_-]{8,}/g) || [];
  runs.sort((a, b) => b.length - a.length);
  for (const r of runs){
    const w = decodeOne(r);
    if (w) return w;
  }
  return null;
}

function decodeOne(clean){
  const bits = unpackBits(clean);
  if (!bits || bits.length < 40) return null;
  let i = 0;
  const get = n => { let v = 0; for (let k = 0; k < n; k++) v = (v << 1) | (bits[i++] || 0); return v; };
  try {
    if (get(4) !== CODE_VER) return null;
    const n = get(1) ? 24 : 16;
    const cnt = get(2) + 1;
    const l = [];
    for (let k = 0; k < cnt; k++){
      const sv = {s: get(2), t: get(4), v: get(7), r: get(8), o: get(1), p: []};
      const len = get(10);
      if (len < 1 || len > 1023) return null;
      let x = get(5), y = get(5);
      if (x >= n || y >= n) return null;
      sv.p.push([x, y]);
      for (let j = 1; j < len; j++){
        const d = DIRS[get(2)];
        x += d[0]; y += d[1];
        if (x < 0 || y < 0 || x >= n || y >= n) return null;
        sv.p.push([x, y]);
      }
      l.push(sv);
    }
    const sum = get(8);
    let calc = 0;
    for (let k = 0; k < i - 8; k++) calc = (calc + bits[k] * (k + 1)) & 255;
    if (calc !== sum) return null;
    while (l.length < LAYERS) l.push({p: [], o: 0, s: 0, t: 0, v: 100, r: 100});
    return {n: n, l: l};
  } catch(e){ return null; }
}

/* 「しまう」という動作は持たない。描いたものは全部その人の作品で、
   盤を離れれば残る。「しまった／しまっていない」という状態を作らないほうが、
   覚えることが減る。制限は作る側（＋を押すとき）で当てる。 */
function keepWork(){
  if (!freeMode) return;
  const w = snapshot();
  const a = listSaves();
  if (curSlot >= 0 && curSlot < a.length){
    // 白紙に戻しただけで離れたなら、前の中身をそのまま残す。
    // 作品を消すのは一覧のゴミ箱の仕事で、こちらの仕事ではない
    if (hasInk(w)){ a[curSlot] = w; putSaves(a); }
    return;
  }
  if (!hasInk(w)) return;                // 何も描かずに離れただけ
  if (a.length >= slots()) return;
  a.push(w); putSaves(a);
  curSlot = a.length - 1;
}

/* ---- 選ぶ札（形／しまったもの、どちらもこの帯で選ぶ） ---- */
/* 札には形そのものを描く。名前だけ並べても、どれを選ぶか決められない。
   しまったものは層ごとの縁の色で描くので、盤で見た姿とつながる */
function drawThumb(el, item, size){
  const n = item.n, SZ = size || 360, u = SZ / n, c = el.getContext('2d');
  el.width = el.height = SZ;
  c.fillStyle = css('--panel'); c.fillRect(0,0,SZ,SZ);
  c.lineJoin = c.lineCap = 'round';
  const line = (path, col, w) => {
    if (path.length < 2) return;
    c.strokeStyle = col; c.lineWidth = w;
    c.beginPath();
    path.forEach((q,i) => {
      const x = q[0]*u + u/2, y = q[1]*u + u/2;
      i ? c.lineTo(x,y) : c.moveTo(x,y);
    });
    c.stroke();
  };
  if (item.path) line(item.path, css('--guide'), u*0.5);
  else if (item.l) item.l.forEach((sv, i) => {
    line(sv.p, css('--r' + (i+1)), u*0.62);
    line(sv.p, SCALES[sv.s].color, u*0.38);
  });
  if (item.plus){                          // 新しく描き始める札
    c.strokeStyle = css('--dim'); c.lineWidth = u*0.22; c.globalAlpha = .55;
    c.beginPath(); c.moveTo(SZ/2, SZ*0.35); c.lineTo(SZ/2, SZ*0.65);
    c.moveTo(SZ*0.35, SZ/2); c.lineTo(SZ*0.65, SZ/2); c.stroke();
    c.globalAlpha = 1;
  }
}

const cardsEl = $('cards'), dotsEl = $('dots');
let pickItems = [];                        // いま帯に並んでいるもの

/* 見えている札だけ描く。1枚ずつ canvas を持つので、数が増えると保存容量ではなく
   画素が効く（実測：120件で60MB。非力な端末では落ちる量）。
   格子は小さく描けば足りるので、寸法も分ける。 */
let cardWatch = null;
function buildCards(items){
  pickItems = items;
  const grid = pickMode === 'works';
  if (cardWatch) cardWatch.disconnect();
  cardWatch = ('IntersectionObserver' in window)
    ? new IntersectionObserver(es => es.forEach(e => {
        if (!e.isIntersecting) return;
        const el = e.target, i = +el.dataset.i;
        if (el.dataset.drawn) return;
        el.dataset.drawn = '1';
        drawThumb(el, pickItems[i], grid ? 200 : 360);
      }), {root: cardsEl, rootMargin: '300px'})
    : null;
  cardsEl.innerHTML = ''; dotsEl.innerHTML = '';
  items.forEach((it, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const c2 = document.createElement('canvas');
    c2.dataset.i = i;
    c2.width = c2.height = grid ? 200 : 360;
    if (it.plus) card.classList.add('plus');
    card.appendChild(c2);                 // 札は絵だけ。名前も長さも要らなかった
    card.onclick = () => {
      if (delMode && !it.plus){ askDelete(it); return; }
      it.pick();
    };
    cardsEl.appendChild(card);
    if (cardWatch) cardWatch.observe(c2);
    else { c2.dataset.drawn = '1'; drawThumb(c2, it, grid ? 200 : 360); }
    dotsEl.appendChild(document.createElement('i'));
  });
  cardsEl.scrollLeft = 0;
  syncCards();
}

/* 中央に来ている札を「選ばれている」ものとして扱う */
function syncCards(){
  const kids = [...cardsEl.children];
  if (!kids.length) return;
  const mid = cardsEl.scrollLeft + cardsEl.clientWidth / 2;
  let best = 0, bd = Infinity;
  kids.forEach((k,i) => {
    const d = Math.abs(k.offsetLeft + k.offsetWidth/2 - mid);
    if (d < bd){ bd = d; best = i; }
  });
  kids.forEach((k,i) => k.classList.toggle('here', i === best));
  [...dotsEl.children].forEach((d,i) => d.classList.toggle('here', i === best));

}
cardsEl.addEventListener('scroll', syncCards, {passive:true});
addEventListener('resize', syncCards);

/* マスの大小は編集ではなく「紙の大きさ」。描いたものを消す理由がない。
   マス目の座標はそのまま使えるので、線を中央に置き直して連れて行く。
   音（角の並び）も完全に保たれる。
   細かい→粗いだけは入り切らないことがあるので、そのときは押せなくする。 */
function grainFits(n){
  const cells = tracks.flatMap(t => t.path);
  if (!cells.length) return true;
  const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
  return (Math.max(...xs) - Math.min(...xs) + 1) <= n &&
         (Math.max(...ys) - Math.min(...ys) + 1) <= n;
}

function updateGrainButtons(){
  const gr = $('grain');
  if (!gr || !freeMode) return;
  [...gr.children].forEach(b => {
    const n = +b.dataset.n;
    b.classList.toggle('on', n === N);
    b.classList.toggle('locked', lockGrid(n));
    b.classList.toggle('off', n !== N && !lockGrid(n) && !grainFits(n));  // 入らない紙
  });
}

/* お知らせは出しっぱなしにしない。用が済んだ字は雑音になる。
   一覧は盤を全面で覆うので、いま見えているほうへ書く */
function say(key){
  const onPicker = (typeof screen !== 'undefined') && screen === 'picker';
  setText(onPicker ? 'pmsg' : 'msg', T(key));
  const mel = $(onPicker ? 'pmsg' : 'msg');
  if (!mel) return;
  mel.classList.remove('faded');
  clearTimeout(window._msgT);
  window._msgT = setTimeout(() => mel.classList.add('faded'), 5000);
}

function switchGrain(n){
  if (n === N) return;
  if (lockGrid(n)){ openBuy(); return; }
  if (!grainFits(n)){ say('noFit'); return; }
  const cells = tracks.flatMap(t => t.path);
  let dx = 0, dy = 0;
  if (cells.length){
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    const x0 = Math.min(...xs), y0 = Math.min(...ys);
    dx = Math.round((n - (Math.max(...xs) - x0 + 1)) / 2) - x0;
    dy = Math.round((n - (Math.max(...ys) - y0 + 1)) / 2) - y0;
  }
  const saved = tracks.map(t => ({
    path: t.path.map(c => [c[0] + dx, c[1] + dy]),
    isLoop: t.isLoop, scale: t.scale, timbre: t.timbre, vol: t.vol, rate: t.rate
  }));
  const mx = [...$('mixer').querySelectorAll('input')].map(e => e.value);
  const rt = [...$('rates').querySelectorAll('input')].map(e => e.value);

  load(n === 16 ? FREE16 : FREE24);

  saved.forEach((sv, i) => {
    const t = tracks[i];
    t.scale = sv.scale; t.timbre = sv.timbre; t.vol = sv.vol; t.rate = sv.rate;
    if (!sv.path.length) return;
    t.path = sv.path;
    t.isLoop = sv.isLoop;
    t.progress = sv.path.length - 1;      // 描き終えた線として引き継ぐ
    markCorners(t);
    if (t.isLoop) seedLoop(t);
  });
  [...$('mixer').querySelectorAll('input')].forEach((e, i) => e.value = mx[i]);
  [...$('rates').querySelectorAll('input')].forEach((e, i) => e.value = rt[i]);
  updateScaleButtons(); updateTimbreButtons(); updateGrainButtons();
  refresh();
}

document.querySelectorAll('#grain button').forEach(b => {
  b.onclick = () => switchGrain(+b.dataset.n);
});
/* ---- 使い方 ----
   自動では進めない。読みに来た人は、忘れた所だけを見たい。
   点を押せばどの頁にも飛べるので、「一段戻る」も語を足さずに済む。 */
const TOOLS = [
  {i:['layers'],           t:'layers', d:'dLayers'},
  {i:['wave'],             t:'tone',   d:'dSound', t2:'mood'},
  {i:['rate'],             t:'rate',   d:'dRate'},
  {i:['coarse','fine'],    t:'grain',  d:'dGrain'},
  {i:['undo'],             t:'undo'},
  {i:['cut'],              t:'cut',    d:'dCut'},
  {i:['clear'],            t:'clear',  d:'dClear'},
  {i:['vol'],              t:'mute'}
];

function buildTools(){
  const box = $('tools');
  if (!box) return;
  box.innerHTML = '';
  TOOLS.forEach(r => {
    const row = document.createElement('div'); row.className = 'trow';
    const ic = document.createElement('div'); ic.className = 'tico';
    ic.innerHTML = r.i.map(svg).join('');
    const tx = document.createElement('div'); tx.className = 'ttxt';

    tx.appendChild(nm);
    if (r.d){
      const ds = document.createElement('div'); ds.className = 'tds';
      ds.textContent = T(r.d); tx.appendChild(ds);
    }
    row.appendChild(ic); row.appendChild(tx);

  });
}

function loadTutor(i){
  tutorStep = i;
  const step = TUTOR[i];
  document.body.classList.add('tutoring');
  document.body.classList.toggle('tools', !!step.tools);
  if (step.tools){
    buildTools();
    tracks.forEach(t => { t.items = []; t.path = []; });   // 音は止める。読む頁なので
  } else {
    load({name:'', n:16, path:step.path, loop:step.loop});
  }
  setText('name', T('howto'));
  setText('msg', T('t' + (i+1)));
  const mel = $('msg');
  if (mel){ mel.classList.remove('faded'); clearTimeout(window._msgT); }
  [...tdots.children].forEach((d, j) => d.classList.toggle('here', j === i));
  $('tnext').classList.remove('ready');
  if (step.tools) $('tnext').classList.remove('ready');
}

/* なぞり切ったら「▸」が灯る。時間で勝手に進めない */
function tutorCheck(){
  if (tutorStep < 0) return;
  const step = TUTOR[tutorStep];
  if (step.tools) return;
  const t = tracks[0];
  if (!t.path.length || t.progress < t.path.length - 1) return;
  if (step.loop && !t.isLoop){          // 閉じた形は輪にして回し続ける
    t.isLoop = true;
    markCorners(t);
    seedLoop(t);
  }
  $('tnext').classList.add('ready');
}

/* ---- 送る／受け取る ----
   送信も無料。拡散が唯一の流入経路なので、送る側を絞るのは自分で広告を止めるのと同じ。

   送るのはコードではなくリンクにする。コードだけを送ると、受け取った人が
   アプリを持っていない場合はただの文字列で、「入れてから貼れ」という導線になる。
   拡散が唯一の流入経路なのに、その入口を install の後ろに置いていた。
   リンクなら、押した瞬間にブラウザで鳴る。decodeWork は塊を長い順に試すので、
   URL ごと貼られても従来どおり読める（アプリ側の受け取りは改修不要）。 */
const SHARE_URL = 'https://hiroaki0227.github.io/linechime/c/#';

/* Android の共有シートへ。アプリ側に窓口があるときだけ出す
   （ブラウザで開いているときは無い） */
function canShareNative(){
  return !!(window.AndroidShare && typeof window.AndroidShare.send === 'function');
}
$('codeshare').onclick = () => {
  try { window.AndroidShare.send(T('shareBody') + String.fromCharCode(10,10) + $('codeout').value); }
  catch(e){ say('badCode'); }
};

/* ---- 撮る ----
   拡散の主戦場（X・TikTok）では、リンクは何も再生しない。足を止めさせるのは動画で、
   ユーザーには自分の作品を動画にする手段が無かった。MEDIA.md の撮影手順は
   端末の画面録画を人手でやる前提で、配る側（作者）にしか使えない。

   MP4（H.264/AAC）で録る。X がそのまま受け付けるので変換が要らない。
   古い WebView では作れないので、作れるときだけボタンを出す。 */
const REC_AIM = 15;      // 狙う長さ（MEDIA.md「完成の瞬間 10〜15秒」）
const REC_MAX = 60;      // 上限。押したまま忘れられないように

/* 輪は繰り返す。一周の途中で切ると、TikTok やリールが動画を繰り返したとき継ぎ目が出る。
   一本の輪なら一周の整数倍に合わせられる。
   多層は周期が揃わない（実測：76マス/速さ100 で9.05秒、32/75 で5.08秒、12/140 で1.02秒。
   4000周ぶん探しても揃う時刻が無かった＝「長回しに耐える」の裏返し）ので、合わせない。 */
function recSeconds(){
  const on = tracks.filter(t => t && t.path && t.path.length);
  if (on.length !== 1 || !on[0].isLoop) return REC_AIM;
  const lap = on[0].path.length / (SPEED * on[0].rate);
  if (!(lap > 0.2)) return REC_AIM;
  const n = Math.max(1, Math.round(REC_AIM / lap));
  return Math.min(REC_MAX, lap * n);
}
const REC_MIME = ['video/mp4;codecs="avc1.42E01E,mp4a.40.2"', 'video/mp4',
                  'video/webm;codecs="vp8,opus"', 'video/webm']
  .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || null;

function canRecord(){
  return !!(REC_MIME && cv && cv.captureStream && audio && master);
}

let recorder = null, recChunks = [], recTimer = null, recTick = null;
let recShape = 'sq';                     // 'sq' = 盤のまま（X）／'v' = 9:16（TikTok・リール・ショート）

/* 9:16 に組む。地の色は本体から取るので、明るい側でも暗い側でも合う。
   盤は横いっぱいに置く（MEDIA.md「縦のまま撮る。あとで切らずに済む」）。 */
function verticalStage(){
  const oc = document.createElement('canvas');
  oc.width = 720; oc.height = 1280;
  const g2 = oc.getContext('2d');
  const bg = (getComputedStyle(document.documentElement)
                .getPropertyValue('--bg') || '#f3f1ec').trim();
  let alive = true;
  const paint = () => {
    if (!alive) return;
    g2.fillStyle = bg; g2.fillRect(0, 0, 720, 1280);
    g2.drawImage(cv, 0, (1280 - 720) / 2, 720, 720);
    requestAnimationFrame(paint);
  };
  paint();
  return {canvas: oc, stop: () => { alive = false; }};
}

function startRec(){
  if (!canRecord() || recorder) return false;
  let tap, vs, stage = null;
  try {
    tap = audio.createMediaStreamDestination();
    master.connect(tap);                 // 出口に枝を1本足すだけ。鳴っている音は触らない
    if (recShape === 'v') stage = verticalStage();
    vs = (stage ? stage.canvas : cv).captureStream(30);
    const st = new MediaStream([...vs.getVideoTracks(), ...tap.stream.getAudioTracks()]);
    recChunks = [];
    recorder = new MediaRecorder(st, {mimeType: REC_MIME, videoBitsPerSecond: 2500000});
  } catch(e){ $('rec').classList.remove('on'); say('movieNo'); return false; }

  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    try { master.disconnect(tap); } catch(e){}
    try { if (stage) stage.stop(); } catch(e){}
    try { vs.getTracks().forEach(t => t.stop()); } catch(e){}
    const blob = new Blob(recChunks, {type: (REC_MIME.split(';')[0])});
    recorder = null; recChunks = [];
    recDone(blob);
  };
  recorder.start();

  const sec = recSeconds(), t0 = performance.now();
  const bar = $('recbar'), lab = $('recsec'), box = $('rec');
  box.classList.remove('fin'); box.classList.add('on');
  lab.textContent = T('movieRec') + ' ' + Math.ceil(sec);
  bar.style.width = '0%';
  recTick = setInterval(() => {                 // 帯は canvas の外なので動画には写らない
    const k = Math.min(1, (performance.now() - t0) / (sec * 1000));
    bar.style.width = (k * 100).toFixed(1) + '%';
    const left = Math.ceil(sec - k * sec);
    if (left > 0) lab.textContent = T('movieRec') + ' ' + left;
  }, 100);
  recTimer = setTimeout(stopRec, sec * 1000);
  return true;
}

function stopRec(){
  if (recTimer){ clearTimeout(recTimer); recTimer = null; }
  if (recTick){ clearInterval(recTick); recTick = null; }
  if (recorder && recorder.state !== 'inactive'){ try { recorder.stop(); } catch(e){} }
}

function recDone(blob){
  /* アプリ側の受け口ができたらここを差し替える。
     いまはブラウザで中身と重さを確かめるための出口。 */
  
  if (window.AndroidShare && typeof window.AndroidShare.openFile === 'function'){
    handToApp(blob);
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'linechime.' + (blob.type.indexOf('mp4') >= 0 ? 'mp4' : 'webm');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  recFinish('movieSaved');                      // 端末のダウンロードへ落ちた
}

/* 動画をアプリへ渡す。橋の上で一度に膨らませない。
   60秒だと base64 で13MBを超えるので、小分けにして書き込ませる。
   片は3の倍数にする（base64 は3バイト＝4文字なので、繋いでも崩れない）。 */
function handToApp(blob){
  const CH = 192000;                            // 3の倍数
  const box = $('rec'), lab = $('recsec'), bar = $('recbar');
  box.classList.remove('fin'); box.classList.add('on');
  lab.textContent = T('movieSend');
  bar.style.width = '0%';
  const fail = () => { try { window.AndroidShare.cancelFile(); } catch(e){}
                       recFinish('movieNo'); };
  const r = new FileReader();
  r.onerror = fail;
  r.onload = () => {
    let u8;
    try { u8 = new Uint8Array(r.result); } catch(e){ fail(); return; }
    try { if (!window.AndroidShare.openFile(blob.type)){ fail(); return; } }
    catch(e){ fail(); return; }
    let at = 0;
    const step = () => {
      const to = Math.min(u8.length, at + CH);
      let raw = '';
      for (let i = at; i < to; i += 0x8000)      // 一度に広げるとスタックが尽きる
        raw += String.fromCharCode.apply(null, u8.subarray(i, Math.min(to, i + 0x8000)));
      try { if (!window.AndroidShare.writeFile(btoa(raw))){ fail(); return; } }
      catch(e){ fail(); return; }
      at = to;
      bar.style.width = (at / u8.length * 100).toFixed(1) + '%';
      if (at < u8.length){ setTimeout(step, 0); return; }   // 画面を固まらせない
      try {
        recFinish(window.AndroidShare.shareFile(T('shareBody')) ? 'movieDone' : 'movieNo');
      } catch(e){ fail(); }
    };
    step();
  };
  r.readAsArrayBuffer(blob);
}

/* 出来上がったことを、消える表示ではなく帯そのもので伝える。
   赤い点が緑に変わり、どこへ行ったかを出して、数秒たってから引く。 */
function recFinish(key){
  const box = $('rec'), lab = $('recsec');
  box.classList.add('on', 'fin');
  lab.textContent = T(key);
  say(key);
  clearTimeout(recFinish.t);
  recFinish.t = setTimeout(() => box.classList.remove('on', 'fin'), 3600);
}

function setShape(k){
  recShape = k;
  $('shsq').classList.toggle('on', k === 'sq');
  $('shv').classList.toggle('on', k === 'v');
}
$('shsq').onclick = () => setShape('sq');
$('shv').onclick  = () => setShape('v');

$('codemovie').onclick = () => {
  if (recorder){ stopRec(); return; }     // 撮っている最中なら、もう一度押して止める
  $('send-w').classList.remove('show');   // 盤を見せる。撮られているものが見えないと不安になる
  if (!startRec()) say('movieNo');
};

/* 買えなかった理由を伝える。黙って終わらせない */
window.onBillingSay = key => setText('buymsg', T(key));

$('send').onclick = openSend;
$('precv').onclick = openRecv;

/* 診断行を出すかどうか。出荷版では要素ごと落ちるので、ここは何もしなくなる
   （`paintDiag` は要素が無ければ黙って戻る）。塊の外に置くのはそのため。 */
let showDiag = true;
try { showDiag = localStorage.getItem('trace_diag') !== '0'; } catch(e){}
function paintDiag(){
  const d = $('diag');
  if (d) d.style.display = showDiag ? 'block' : 'none';
}


document.body.classList.add('titling');
/* 触れた瞬間に「入る」。音は鳴り出すのではなく、ゆっくり満ちてくる */
/* リンクで届いた作品。音は最初の操作までは出せない決まりなので、
   ここでは読むだけにして、触れた瞬間に鳴らす。 */
let linked = null;
try {
  if (location.hash.length > 1) linked = decodeWork(decodeURIComponent(location.hash.slice(1)));
} catch(e){ linked = null; }

let entered = false;
const enter = () => {
  if (entered) return;
  entered = true;
  initAudio();                          // 最初の操作で音を有効にする決まりがある
  startPad();
  padLevel(0.05, 3.2);                  // 3秒かけて空間が満ちる
  if (linked){                          // 届いた線は、献立を挟まずそのまま鳴らす
    const w = linked; linked = null;
    openWork(w, -1);
    say(canMake() ? 'gotIt' : 'gotNoRoom');
    return;
  }
  $('title').classList.add('menu');     // 献立が浮かび上がる。裏では線が描かれ続ける
  setTimeout(() => $('title').classList.add('ready'), 900);
};
$('title').addEventListener('pointerdown', enter);

try {
  applyLang();
  paintMute();
  paintDiag();
  paintBuyLink();
  load(DATA[0]);
  updateTimbreButtons();
  updateScaleButtons();
  fitCanvas();
} catch(e){
  setText('msg', '起動に失敗: ' + e.message);   // 黙って白い画面にしない
  console.error(e);
}
tick();   // 起動処理が転んでも、描画ループだけは必ず動かす
</script>
